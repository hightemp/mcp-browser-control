<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Browser Extension Tool Panel</title>
    <link rel="stylesheet" href="panel.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Browser Extension Tool</h1>
            <div class="connection-status">
                <span id="connectionStatus" class="status-disconnected">Отключено</span>
                <button id="connectBtn" class="btn btn-primary">Подключиться</button>
            </div>
        </header>

        <main class="main-content">
            <!-- Секция команд -->
            <section class="commands-section">
                <h2>Команды</h2>
                
                <div class="command-group">
                    <h3>Получение HTML</h3>
                    <div class="command-row">
                        <button id="getHtmlBtn" class="btn btn-secondary">Получить HTML страницы</button>
                        <div class="input-group">
                            <input type="text" id="selectorInput" placeholder="CSS селектор (например, .class, #id)" class="input">
                            <button id="getHtmlBySelectorBtn" class="btn btn-secondary">Получить HTML по селектору</button>
                        </div>
                    </div>
                </div>

                <div class="command-group">
                    <h3>Логи</h3>
                    <div class="command-row">
                        <button id="getConsoleLogBtn" class="btn btn-secondary">Получить лог консоли</button>
                        <button id="getNetworkLogBtn" class="btn btn-secondary">Получить network лог</button>
                    </div>
                </div>

                <div class="command-group">
                    <h3>Взаимодействие с элементами</h3>
                    <div class="command-row">
                        <div class="input-group">
                            <input type="text" id="clickSelectorInput" placeholder="CSS селектор для клика" class="input">
                            <button id="clickElementBtn" class="btn btn-secondary">Кликнуть элемент</button>
                        </div>
                    </div>
                    <div class="command-row">
                        <div class="input-group">
                            <input type="text" id="inputSelectorInput" placeholder="CSS селектор для ввода" class="input">
                            <input type="text" id="inputValueInput" placeholder="Значение для ввода" class="input">
                            <button id="inputDataBtn" class="btn btn-secondary">Ввести данные</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Секция результатов -->
            <section class="results-section">
                <h2>Результаты</h2>
                <div class="results-container">
                    <div class="results-header">
                        <span id="resultsCount">0 результатов</span>
                        <button id="clearResultsBtn" class="btn btn-small">Очистить</button>
                    </div>
                    <div id="resultsContent" class="results-content">
                        <p class="no-results">Результаты команд будут отображаться здесь</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Модальное окно для просмотра больших результатов -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitle">Результат</h3>
                    <button id="modalCloseBtn" class="btn btn-small">&times;</button>
                </div>
                <div class="modal-body">
                    <pre id="modalContent"></pre>
                </div>
                <div class="modal-footer">
                    <button id="copyModalContentBtn" class="btn btn-primary">Копировать</button>
                </div>
            </div>
        </div>
    </div>

    <script src="panel.js"></script>
</body>
</html>
