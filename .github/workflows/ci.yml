name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: chrome-extension/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix chrome-extension

      - name: Lint Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: ./cmd/... ./internal/...

      - name: Verify, test, and build
        run: make fmt-check vet test-race coverage extension-check extension-build build

      - name: Set up Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2

      - name: Run two-browser E2E
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: make e2e

      - name: Build and verify reproducible release bundle
        run: make release-check

      - name: Upload CI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ github.sha }}
          path: |
            bin/mcp-browser-control
            coverage.out
            chrome-extension/dist/extension
            release
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: chrome-extension/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix chrome-extension

      - name: Install pinned security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate workflows
        run: actionlint .github/workflows/*.yml

      - name: Scan vulnerabilities, licenses, and secrets
        run: make security-check
